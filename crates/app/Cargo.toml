[package]
name = "fastpaste"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Light and fast Linux app built in Rust with Slint."

[dependencies]
fastpaste-core = { path = "../core" }
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2", "unstable-winit-030"] }
raw-window-handle = "0.6"
png = "0.18"
# JPEG copies are converted to PNG when recorded.
zune-jpeg = "0.5.15"
# async-io instead of the default tokio: no async runtime in this app.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# Already in the tree through ksni (same features); direct use is the Background portal for autostart in Flatpak.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
x11rb = { version = "0.14", default-features = false, features = ["xfixes", "xtest"] }

[build-dependencies]
slint-build = "1.18"
